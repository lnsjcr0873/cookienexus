name: CookieNexus CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node Dependencies & Build
        run: |
          npm install
          npm --workspace=@cookienexus/server run build
          npm --workspace=@cookienexus/sdk-ts run build

      - name: Run Server & SDK Unit Tests
        run: |
          node packages/server/dist/tests/run_tests.js
          node packages/sdk-ts/dist/tests/sdk.test.js
          python packages/sdk-python/tests/test_sdk.py

      - name: Run Full End-to-End System Verification
        run: |
          python scripts/verify_all.py

      - name: Run High-Concurrency Benchmark
        run: |
          python scripts/benchmark_sync.py
